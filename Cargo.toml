[package]
name = "avc"
version = "0.0.1"
edition = "2024"

[dependencies]
blake3 = "=1.8.7"
usage-rs = "7.1.5"
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "1.0.154"
rusqlite = { version = "=0.40.2", features = ["hooks"] }
