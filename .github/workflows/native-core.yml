name: Native core

on:
  push:
    branches:
      - main
      - implementation/native-core-2026-11-02
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust with formatting and lint support
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build and test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Independently qualify original codec fixture
        run: cargo test --manifest-path docs/experiments/codec_rust/Cargo.toml --locked
